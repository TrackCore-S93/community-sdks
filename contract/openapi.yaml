components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "A secret key (`cm_sk_…`, backend only) or a publishable key (`cm_pk_…`, in the app)."

  parameters:
    SessionHeader:
      name: X-Community-Session
      in: header
      required: false
      description: "The session token, with a publishable key. Names the end user the call acts for."
      schema:
        type: string
    ExternalIdHeader:
      name: X-External-Id
      in: header
      required: false
      description: "Your own id for the end user, with a secret key. Names the end user the call acts for."
      schema:
        type: string
      example: user_42
    TopicId:
      name: topic_id
      in: path
      required: true
      description: "The topic's id."
      schema:
        type: string
      example: "cm_top_01HZX…"
    PostId:
      name: post_id
      in: path
      required: true
      description: "The post's id."
      schema:
        type: string
      example: "cm_post_01HZX…"
    CommentId:
      name: comment_id
      in: path
      required: true
      description: "The comment's id."
      schema:
        type: string
      example: "cm_cmt_01HZX…"
    MediaId:
      name: media_id
      in: path
      required: true
      description: "The image's id, from starting the upload."
      schema:
        type: string
      example: "cm_med_01HZX…"
    ArchiveId:
      name: archive_id
      in: path
      required: true
      description: "The archived item's id."
      schema:
        type: string
      example: "cm_arc_01HZX…"
    NotificationId:
      name: notification_id
      in: path
      required: true
      description: "The notification's id."
      schema:
        type: string
      example: "cm_ntf_01HZX…"
    ExternalId:
      name: external_id
      in: path
      required: true
      description: "Your own id for the user."
      schema:
        type: string
      example: "user_42"
    Emoji:
      name: emoji
      in: path
      required: true
      description: "The emoji, percent-encoded. Any emoji; skin tones count as separate emoji."
      schema:
        type: string
      example: "❤️"
    LimitPosts:
      name: limit
      in: query
      required: false
      description: "Page size, 1 to 40. Left out, the creator's setting."
      schema:
        type: integer
      example: 20
    Limit:
      name: limit
      in: query
      required: false
      description: "Page size, 1 to 100. Left out, 20."
      schema:
        type: integer
      example: 20
    Before:
      name: before
      in: query
      required: false
      description: "A `next_cursor` from the page before: the next older items."
      schema:
        type: string
    After:
      name: after
      in: query
      required: false
      description: "A `next_cursor` from the page before: the next items."
      schema:
        type: string
    TopicFilter:
      name: topic_id
      in: query
      required: false
      description: "Only this topic's posts. Left out, every topic."
      schema:
        type: string
      example: "cm_top_01HZX…"
    Idempotency:
      name: Idempotency-Key
      in: header
      required: false
      description: "A key you choose, 1 to 255 printable characters. A request retried with the same key by the same user writes nothing and returns the first result."
      schema:
        type: string
      example: "b3f1c2a0-post-1"

  schemas:
    Session:
      type: object
      description: "A session token for one end user. The token appears in this reply and nowhere else."
      x-go-type: httpx.sessionResponse
      required: [token, token_type, header, external_id, environment, issued_at, expires_at, ttl_seconds]
      properties:
        token:
          type: string
          description: "The session token. Send it in the header named by `header`."
          example: "cm_st_live_…"
        token_type:
          type: string
          description: "Always `opaque`: the token carries nothing to decode."
          example: "opaque"
        header:
          type: string
          description: "The request header the token is sent in."
          example: "X-Community-Session"
        external_id:
          type: string
          description: "The user the session is for."
          example: "user_42"
        environment:
          type: string
          description: "`test` or `live`, the environment of the key that minted it."
          example: "live"
        issued_at:
          type: string
          format: date-time
          description: "When the session was minted."
        expires_at:
          type: string
          format: date-time
          description: "When it stops working."
        ttl_seconds:
          type: integer
          description: "Its lifetime in seconds."
          example: 3600
    SessionRequest:
      type: object
      description: "Who the session is for and how long it lasts."
      x-go-type: httpx.sessionRequest
      required: [external_id]
      properties:
        external_id:
          type: string
          description: "Your own id for the end user, 1 to 255 printable characters."
          example: "user_42"
        ttl_seconds:
          type: integer
          description: "Lifetime in seconds, 60 to 86400. Left out, one hour."
          example: 3600
    WhoAmI:
      type: object
      description: "Which customer and key the service sees."
      x-go-type: httpx.whoAmIBody
      required: [customer_id, key_id, key_kind, environment]
      properties:
        customer_id:
          type: string
          description: "The customer's public id."
          example: "cm_cus_…"
        key_id:
          type: string
          description: "The key's public id (not the key itself)."
          example: "cm_key_…"
        key_kind:
          type: string
          description: "`secret` or `publishable`."
          example: "publishable"
        environment:
          type: string
          description: "`test` or `live`."
          example: "live"
    EndUser:
      type: object
      description: "The end user a call acts for."
      x-go-type: httpx.endUserBody
      required: [external_id, via_session]
      properties:
        external_id:
          type: string
          description: "Your own id for the user."
          example: "user_42"
        via_session:
          type: boolean
          description: "True when the user was named by a session token, false when by `X-External-Id`."
          example: true
    ErasedUser:
      type: object
      description: "The result of erasing an end user."
      x-go-type: httpx.erasedBody
      required: [external_id, deleted]
      properties:
        external_id:
          type: string
          description: "The user that was named."
          example: "user_42"
        deleted:
          type: boolean
          description: "False when there was nobody by that id, which is not an error."
          example: true
    Deleted:
      type: object
      description: "The result of deleting a topic, post or comment."
      x-go-type: httpx.deletedBody
      required: [id, deleted]
      properties:
        id:
          type: string
          description: "The id that was named."
          example: "cm_post_…"
        deleted:
          type: boolean
          description: "False when it was already gone, which is not an error."
          example: true
    Profile:
      type: object
      description: "One member of the community."
      x-go-type: httpx.profileBody
      required: [external_id, username, avatar_url, cover_url, bio, role, version, joined_at, updated_at]
      properties:
        external_id:
          type: string
          description: "Your own id for the user."
          example: "user_42"
        username:
          type: string
          description: "The member's name, unique in the community ignoring case."
          example: "Annie"
        avatar_url:
          type: string
          description: "A short-lived link to the profile photo, or an empty string."
          example: ""
        cover_url:
          type: string
          description: "A short-lived link to the profile background, or an empty string."
          example: ""
        bio:
          type: string
          description: "The member's bio, or an empty string."
          example: "Lifting since 2019"
        role:
          description: "The label shown beside the member's name."
          allOf:
            - $ref: '#/components/schemas/Role'
        version:
          type: integer
          description: "Goes up by one each time the profile changes."
          example: 1
        joined_at:
          type: string
          format: date-time
          description: "When the user joined the community."
        updated_at:
          type: string
          format: date-time
          description: "When the profile last changed."
    CommunitySummary:
      type: object
      description: "The community at a glance."
      x-go-type: httpx.communitySummaryBody
      required: [members_count, avatar_urls]
      properties:
        members_count:
          type: integer
          description: "How many users have joined the community."
          example: 124
        avatar_urls:
          type: array
          description: "Links to the profile photos of up to four members who have one, picked at random on every call. Empty when nobody has a photo. The links expire, like every image link."
          items:
            type: string
          example: ["https://…/avatar-1.webp", "https://…/avatar-2.webp"]
    Member:
      type: object
      description: "A member's profile as another reader sees it."
      x-go-type: httpx.memberBody
      required: [external_id, username, avatar_url, cover_url, bio, role, version, joined_at, updated_at, is_me]
      properties:
        external_id:
          type: string
          description: "Your own id for the user."
          example: "user_42"
        username:
          type: string
          description: "The member's name, unique in the community ignoring case."
          example: "Annie"
        avatar_url:
          type: string
          description: "A short-lived link to the profile photo, or an empty string."
          example: ""
        cover_url:
          type: string
          description: "A short-lived link to the profile background, or an empty string."
          example: ""
        bio:
          type: string
          description: "The member's bio, or an empty string."
          example: "Lifting since 2019"
        role:
          description: "The label shown beside the member's name."
          allOf:
            - $ref: '#/components/schemas/Role'
        version:
          type: integer
          description: "Goes up by one each time the profile changes."
          example: 1
        joined_at:
          type: string
          format: date-time
          description: "When the user joined the community."
        updated_at:
          type: string
          format: date-time
          description: "When the profile last changed."
        is_me:
          type: boolean
          description: "True when the profile is the reader's own, the only one they can edit."
          example: false
    Membership:
      type: object
      description: "Whether the user has joined, and their profile if so."
      x-go-type: httpx.membershipBody
      required: [joined, profile]
      properties:
        joined:
          type: boolean
          description: "False until the user has chosen a username."
          example: true
        profile:
          anyOf:
            - $ref: '#/components/schemas/Profile'
            - type: 'null'
          description: "Null until the user has joined."
    UsernameAvailability:
      type: object
      description: "Whether a username is free. A hint for the form; joining decides."
      x-go-type: httpx.availabilityBody
      required: [username, available]
      properties:

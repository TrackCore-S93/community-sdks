  /v1/live:
    get:
      operationId: connectLive
      tags: [Live]
      summary: "Live updates (WebSocket)"
      description: "Upgrades to a WebSocket that receives one JSON object per change, each a `LiveEvent`. The first message is `{\"type\":\"ready\"}`. The connection only listens: posting, reacting and commenting use their own routes. Send `{\"type\":\"watch\",\"topic_id\":\"…\"}` to follow one topic, or an empty `topic_id` for all. Events from another community, from hidden topics and across a block are never delivered. A user may hold at most 5 connections.\n\n**Who may call it.** For one end user (a publishable key with a session token, or a secret key with `X-External-Id`), or the creator's backend with a secret key alone, which also sees hidden topics."
      x-community-auth: member_or_creator
      x-community-sdk: live.connect
      parameters:
        - name: topic_id
          in: query
          required: false
          description: "Follow only this topic from the start."
          schema:
            type: string
          example: "cm_top_01HZX…"
        - $ref: '#/components/parameters/SessionHeader'
        - $ref: '#/components/parameters/ExternalIdHeader'

    LiveEventType:
      type: string
      description: "The kinds of live message."
      enum: ["post.created", "post.deleted", "post.pinned", "post.unpinned", "post.reactions", "comment.created", "comment.deleted", "comment.reactions", "notification.created"]
    ErrorEnvelope:
      type: object
      description: "The body of every non-2xx reply."
      x-go-type: apperror.Envelope
      required: [error]
      properties:
        error:
          description: "What went wrong."
          allOf:
            - $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      description: "What went wrong."
      x-go-type: apperror.Body
      required: [code, message, retry_after_seconds]
      properties:
        code:
          description: "Which problem this is. Branch on this."
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: "A sentence that can be shown to the user."
          example: "This username is already taken."
        request_id:
          type: string
          description: "A reference for this request, to quote when reporting a problem."
          example: "req_3f9c…"
        fields:
          type: object
          additionalProperties:
            type: string
          description: "For `validation_failed`: each field that failed, and why."
          example: {"username": "must be 3 to 30 characters"}
        retry_after_seconds:
          type: [integer, 'null']
          description: "How long to wait before trying again, when the server knows. Otherwise null."
    ErrorCode:
      type: string
      description: "The closed list of error codes."
      enum:
        - invalid_request
        - ambiguous_credentials
        - unauthenticated
        - credential_missing
        - credential_malformed
        - credential_unknown
        - credential_revoked
        - session_invalid
        - user_scope_violation
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - username_taken
        - already_joined
        - community_join_required
        - comment_replies_disabled
        - profile_viewing_disabled
        - topic_name_taken
        - media_not_uploaded
        - media_too_large
        - media_invalid
        - payload_too_large
        - validation_failed
        - rate_limited
        - internal_error
        - service_unavailable
        - timeout

# Each error code with its HTTP status, its default message and whether trying
# again can succeed. Rendered from lib/core/apperror.
x-community-error-catalogue:
  - code: invalid_request
    status: 400
    message: "The request is not valid."
    retryable: false
  - code: ambiguous_credentials
    status: 400
    message: "Send exactly one credential."
    retryable: false
  - code: unauthenticated
    status: 401
    message: "Authentication is required."
    retryable: false
  - code: credential_missing
    status: 401
    message: "No API key was provided."
    retryable: false
  - code: credential_malformed
    status: 401
    message: "The API key is not in a valid format."
    retryable: false
  - code: credential_unknown
    status: 401
    message: "The API key is not recognised."
    retryable: false
  - code: credential_revoked
    status: 401
    message: "The API key is no longer valid."
    retryable: false
  - code: session_invalid
    status: 401
    message: "The session token is not valid or has expired."
    retryable: false
  - code: user_scope_violation
    status: 403
    message: "This session belongs to a different user."
    retryable: false
  - code: forbidden
    status: 403
    message: "You do not have permission to do this."
    retryable: false
  - code: not_found
    status: 404
    message: "The requested resource was not found."
    retryable: false
  - code: method_not_allowed
    status: 405
    message: "This method is not allowed on this resource."
    retryable: false
  - code: conflict
    status: 409
    message: "The request conflicts with the current state of the resource."
    retryable: false
  - code: username_taken
    status: 409
    message: "This username is already taken."
    retryable: false
  - code: already_joined
    status: 409
    message: "This user has already joined the community."
    retryable: false
  - code: community_join_required
    status: 403
    message: "Join the community before doing this."
    retryable: false
  - code: comment_replies_disabled
    status: 403
    message: "Replies to comments are turned off for this community."
    retryable: false
  - code: profile_viewing_disabled
    status: 403
    message: "Viewing other members' profiles is turned off for this community."
    retryable: false
  - code: topic_name_taken
    status: 409
    message: "A topic with this name already exists."
    retryable: false
  - code: media_not_uploaded
    status: 409
    message: "The file has not been uploaded yet."
    retryable: false
  - code: media_too_large
    status: 413
    message: "The image is larger than the upload limit."
    retryable: false
  - code: media_invalid
    status: 422
    message: "The file is not an image that can be processed."
    retryable: false
  - code: payload_too_large
    status: 413
    message: "The request body is too large."
    retryable: false
  - code: validation_failed
    status: 422
    message: "Some fields are not valid."
    retryable: false
  - code: rate_limited
    status: 429
    message: "Too many requests. Please slow down."
    retryable: true
  - code: internal_error
    status: 500
    message: "Something went wrong on our side."
    retryable: false
  - code: service_unavailable
    status: 503
    message: "The service is temporarily unavailable."
    retryable: true
  - code: timeout
    status: 504
    message: "The request took too long to complete."
    retryable: true

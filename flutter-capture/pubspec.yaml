name: trackcore_community_capture
description: >-
  Opens the camera or the gallery, picks a file or records a voice note, and
  uploads it to Community in one call. An add-on to trackcore_community.
version: 0.1.2
repository: https://github.com/TrackCore-S93/community-sdks/tree/main/flutter-capture
documentation: https://community.trackcore.app/developer/sdk/flutter/media
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  image_picker: ^1.1.0
  path_provider: ^2.1.6
  record: ^7.2.0
  trackcore_community:
    git:
      url: https://github.com/TrackCore-S93/community-sdks.git
      ref: flutter-v0.1.2
      path: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  image_picker_platform_interface: ^2.10.0
  plugin_platform_interface: ^2.1.0
  lints: ^6.0.0
